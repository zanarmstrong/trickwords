<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trick Words</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #1a6fe8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #setup {
    width: 100%;
    max-width: 520px;
    padding: 0 8px;
  }
  #setup h1 { font-size: 36px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  #setup p { font-size: 15px; color: rgba(255,255,255,0.75); margin-bottom: 20px; line-height: 1.5; }
  #my-words-hint { font-size: 15px; color: rgba(255,255,255,0.75); margin-bottom: 12px; line-height: 1.5; }

  #word-input {
    width: 100%;
    min-height: 120px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    resize: vertical;
    color: #1a1a1a;
    line-height: 1.6;
    outline: none;
    background: rgba(255,255,255,0.92);
    transition: background 0.15s;
  }
  #word-input:focus { background: #fff; }
  #slider-row { margin-top: 10px; margin-bottom: 20px; }
  #slider-label { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: 10px; display: block; }
  #slider-label strong { color: #fff; font-size: 16px; }

  #session-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.3);
    outline: none;
    cursor: pointer;
  }
  #session-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #session-slider::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  #pool-row { margin-top: 10px; margin-bottom: 6px; display: none; }
  #pool-label { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: 10px; display: block; }
  #pool-label strong { color: #fff; font-size: 16px; }
  #pool-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.3);
    outline: none;
    cursor: pointer;
  }
  #pool-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #pool-slider::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  #start-btn {
    width: 100%;
    padding: 16px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.5px;
    font-family: inherit;
  }
  #start-btn:hover { background: rgba(255,255,255,0.3); }
  #start-btn:active { transform: scale(0.98); }

  #mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
    gap: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    background: transparent;
    color: rgba(255,255,255,0.65);
    transition: background 0.15s, color 0.15s;
  }
  .mode-btn.active {
    background: #fff;
    color: #1a6fe8;
  }

  /* PRACTICE SCREEN */
  #practice {
    display: none;
    width: 100%;
    height: 100vh;
    position: fixed;
    top: 0; left: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.4s;
  }
  #practice.active { display: flex; }

  #word-display {
    font-size: clamp(80px, 20vw, 160px);
    font-weight: 800;
    color: #fff;
    line-height: 1;
    text-align: center;
    padding: 0 32px;
    user-select: none;
    animation: wordPop 0.25s cubic-bezier(0.34,1.56,0.64,1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
  }
  .letter {
    display: inline-block;
    cursor: pointer;
    transition: font-size 0.3s cubic-bezier(0.34,1.56,0.64,1),
                margin 0.3s cubic-bezier(0.34,1.56,0.64,1),
                opacity 0.3s,
                transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    font-size: 1em;
    line-height: 1;
  }
  .letter:hover:not(.zoomed) { transform: scale(1.08); }
  .letter.zoomed {
    font-size: 2.5em;
    margin: 0 0.08em;
  }
  .letter.shrunk {
    opacity: 0.45;
  }
  @keyframes wordPop {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  #word-counter { font-size: 16px; color: rgba(255,255,255,0.7); font-weight: 500; position: fixed; bottom: 22px; right: 22px; }

  #controls { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; align-items: center; }
  #controls-row { display: flex; gap: 16px; align-items: center; }

  .ctrl-btn {
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: transform 0.1s, opacity 0.15s;
  }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: default; }

  .nav-btn {
    width: 64px; height: 64px;
    font-size: 26px;
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }

  #check-btn {
    padding: 0 20px;
    height: 48px;
    font-size: 14px;
    background: #fff;
    letter-spacing: 0.3px;
  }
  #check-btn:hover { opacity: 0.9; }

  #firework-btn {
    width: 64px; height: 64px;
    font-size: 26px;
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  #firework-btn:hover { background: rgba(255,255,255,0.3); }

  #exit-btn {
    position: fixed;
    top: 20px; right: 20px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  #exit-btn:hover { background: rgba(255,255,255,0.3); }

  #spoken-flash {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    margin-top: 20px;
    height: 28px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #spoken-flash.show { opacity: 1; }

  /* FIREWORKS CANVAS OVERLAY */
  #fw-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    z-index: 999;
  }
  #fw-overlay.active { display: block; }

  #fw-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  #fw-restart {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    transition: background 0.15s;
    z-index: 1001;
  }
  #fw-restart:hover { background: rgba(255,255,255,0.35); }

  #fw-word {
    position: absolute;
    z-index: 1000;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: clamp(80px, 20vw, 160px);
    font-weight: 800;
    color: #fff;
    letter-spacing: -2px;
    text-align: center;
    opacity: 0;
    text-shadow: 0 0 40px rgba(255,255,255,0.8);
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>Practice: Reading Words</h1>
  <div id="mode-toggle">
    <button class="mode-btn" id="mode-my">My words</button>
    <button class="mode-btn" id="mode-top">Top 999</button>
  </div>
  <p id="my-words-hint">Type or paste your own words below. Then press Start!</p>
  <textarea id="word-input" spellcheck="false">and, a, the, is, his, of, as, has, to, into, we, he, she, be, me, for, or, you, your, I, they, was, one, said, from, have, do, does, were, are, who, what, when, where, there, here, why, by, my, try, put, two, too, very, also, come, some</textarea>
  <div id="pool-row">
    <span id="pool-label">Choose from top <strong id="pool-num">200</strong> most common words</span>
    <input type="range" id="pool-slider" min="1" max="999" value="200">
  </div>
  <div id="slider-row">
    <span id="slider-label">Practise <strong id="session-num">30</strong> of <span id="total-num">47</span><span id="session-suffix"> words</span></span>
    <input type="range" id="session-slider" min="1" max="47" value="30">
  </div>
  <button id="start-btn">Start ▶</button>
</div>

<div id="practice">
  <button id="exit-btn">✕ Reset words</button>
  <div id="word-display">word</div>
  <div id="word-counter">1 / 48</div>
  <div id="spoken-flash"></div>
  <div id="controls">
    <button class="ctrl-btn" id="check-btn">🔊 Say it</button>
    <div id="controls-row">
      <button class="ctrl-btn nav-btn" id="back-btn">←</button>
      <button class="ctrl-btn" id="firework-btn">🎆</button>
      <button class="ctrl-btn nav-btn" id="fwd-btn">→</button>
    </div>
  </div>
</div>

<!-- FIREWORKS OVERLAY -->
<div id="fw-overlay">
  <canvas id="fw-canvas"></canvas>
  <div id="fw-word"></div>
  <button id="fw-restart" style="display:none">&#8592; Start over</button>
</div>

<script>
var BG_COLORS = [
  '#1a6fe8','#e84040','#d4700a','#7c3aed',
  '#0d9488','#db2777','#16a34a','#b45309',
  '#0284c7','#9333ea'
];

var words = [], idx = 0, colorIdx = 0;

// ── Speech ──
function pickBestVoice() {
  var voices = window.speechSynthesis.getVoices();
  // Prefer high-quality named voices, in order of preference
  var preferred = [
    'Zoe', 'Samantha', 'Karen',  'Daniel', 'Moira', 'Tessa', // macOS/iOS naturals
    'Google US English', 'Google UK English Female', 'Google UK English Male'
  ];
  for (var p = 0; p < preferred.length; p++) {
    for (var v = 0; v < voices.length; v++) {
      if (voices[v].name.indexOf(preferred[p]) !== -1) return voices[v];
    }
  }
  // Fallback: any non-compact English voice
  var enVoices = voices.filter(function(v) {
    return v.lang && v.lang.startsWith('en') &&
           !v.name.toLowerCase().includes('compact') &&
           !v.name.toLowerCase().includes('junior');
  });
  return enVoices.length > 0 ? enVoices[0] : null;
}

function speakWord(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  function doSpeak() {
    var utt = new SpeechSynthesisUtterance(word);
    utt.rate = 0.85; utt.pitch = 1.0; utt.volume = 1.0;
    var voice = pickBestVoice();
    if (voice) utt.voice = voice;
    window.speechSynthesis.speak(utt);
  }
  if (window.speechSynthesis.getVoices().length > 0) { doSpeak(); }
  else { window.speechSynthesis.onvoiceschanged = doSpeak; setTimeout(doSpeak, 300); }
}

var flashTimer = null;
function showFlash(msg) {
  var el = document.getElementById('spoken-flash');
  el.textContent = msg; el.classList.add('show');
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

// ── Fireworks ──
var canvas, ctx, fwParticles = [], fwAnimId = null, fwShapeCounter = 0;

function playFireworkSound(delayMs) {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ac = new AudioCtx();

    // Single ding — called once per shape with its own delay
    [1046.5].forEach(function(freq, i) {
      var when = ac.currentTime + (delayMs / 1000);

      // Main tone (sine for clarity)
      var osc = ac.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      // Second harmonic for a slightly richer piano-like tone
      var osc2 = ac.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2;

      var gain = ac.createGain();
      gain.gain.setValueAtTime(0.0, when);
      gain.gain.linearRampToValueAtTime(0.6, when + 0.01);   // sharp attack
      gain.gain.exponentialRampToValueAtTime(0.001, when + 1.4); // natural decay

      var gain2 = ac.createGain();
      gain2.gain.setValueAtTime(0.0, when);
      gain2.gain.linearRampToValueAtTime(0.15, when + 0.01);
      gain2.gain.exponentialRampToValueAtTime(0.001, when + 0.6);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc2.connect(gain2);
      gain2.connect(ac.destination);

      osc.start(when);  osc.stop(when + 1.5);
      osc2.start(when); osc2.stop(when + 0.7);
    });

  } catch(e) { /* silently skip if audio not available */ }
}

// Schedule a single note on an existing AudioContext at a given absolute time
function scheduleNote(ac, freq, oscType, volume, decay, when) {
  var osc = ac.createOscillator();
  osc.type = oscType;
  osc.frequency.setValueAtTime(freq * 1.015, when);
  osc.frequency.exponentialRampToValueAtTime(freq, when + 0.08);

  var gain = ac.createGain();
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(volume, when + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, when + decay);

  var osc2 = ac.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.value = freq * 2;

  var gain2 = ac.createGain();
  gain2.gain.setValueAtTime(0, when);
  gain2.gain.linearRampToValueAtTime(volume * 0.2, when + 0.01);
  gain2.gain.exponentialRampToValueAtTime(0.001, when + decay * 0.5);

  osc.connect(gain);   gain.connect(ac.destination);
  osc2.connect(gain2); gain2.connect(ac.destination);
  osc.start(when);  osc.stop(when + decay + 0.1);
  osc2.start(when); osc2.stop(when + decay * 0.5 + 0.1);
}

function launchFireworks(word) {
  var overlay = document.getElementById('fw-overlay');
  var fwWord  = document.getElementById('fw-word');
  canvas = document.getElementById('fw-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx = canvas.getContext('2d');
  fwParticles = [];
  fwWord.textContent = word;
  fwWord.style.opacity = '0';

  // Measure the exact position of the practice word and match it
  var wordEl = document.getElementById('word-display');
  var rect = wordEl.getBoundingClientRect();
  fwWord.style.top = rect.top + 'px';
  fwWord.style.bottom = 'auto';
  fwWord.style.transform = 'none';

  overlay.classList.add('active');

  var mode = fwShapeCounter % 3; // 0=fireworks, 1=hearts, 2=stars
  fwShapeCounter++;
  var shapeCount = 3 + Math.floor(Math.random() * 4); // 3-6

  var stagger = mode === 0 ? 300 : 180;
  for (var si = 0; si < shapeCount; si++) {
    playFireworkSound(si * stagger);
  }

  if (mode === 0) {
    runFireworks(shapeCount);
  } else if (mode === 1) {
    runBigShapes('hearts', shapeCount);
  } else {
    runBigShapes('stars', shapeCount);
  }

  // Word fades in at 1.4s
  setTimeout(function(){
    fwWord.style.transition = 'opacity 0.5s';
    fwWord.style.opacity = '1';
    speakWord(word);
  }, 1300);

  // Fade out at 3.2s
  setTimeout(function(){
    fwWord.style.transition = 'opacity 0.6s';
    fwWord.style.opacity = '0';
  }, 3200);

  // Hide overlay at 3.8s
  setTimeout(function(){
    overlay.classList.remove('active');
    if (fwAnimId) { cancelAnimationFrame(fwAnimId); fwAnimId = null; }
    fwParticles = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 3800);
}

// ── End-of-session celebration ──
function launchEndCelebration() {
  var overlay = document.getElementById('fw-overlay');
  var fwWord  = document.getElementById('fw-word');
  canvas = document.getElementById('fw-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx = canvas.getContext('2d');

  // Cancel any running animations
  if (fwAnimId)      { cancelAnimationFrame(fwAnimId);      fwAnimId = null; }
  if (bigShapeAnimId){ cancelAnimationFrame(bigShapeAnimId); bigShapeAnimId = null; }
  fwParticles = [];

  fwWord.textContent = '';
  overlay.classList.add('active');

  // One shared AudioContext for all celebration sounds
  var celebAc = null;
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) celebAc = new AudioCtx();
  } catch(e) {}

  // Pentatonic major — burst notes (louder, longer)
  var burstNotes  = [523.25, 659.25, 784, 880, 1046.5, 1174.66, 1318.5, 784, 1046.5, 659.25, 880, 1318.5];
  var burstTypes  = ['sine','sine','triangle','sine','sine','triangle','sine','sine','triangle','sine','triangle','sine'];
  // Shape notes — interleaved pitches, slightly softer/shorter
  var shapeNotes  = [880, 1046.5, 784, 1318.5, 659.25, 1174.66, 880, 523.25, 1046.5, 784, 1318.5, 659.25, 880, 1046.5, 784, 523.25];

  // Many firework bursts staggered — each with its own note at the same moment
  var burstCount = 12;
  for (var bi = 0; bi < burstCount; bi++) {
    (function(b) {
      var delayMs = b * 320;
      if (celebAc) scheduleNote(celebAc, burstNotes[b], burstTypes[b], 0.45, 1.0 + b * 0.05, celebAc.currentTime + delayMs / 1000);
      setTimeout(function() {
        var pos = randPos();
        burst(pos.x, pos.y, randPalette());
      }, delayMs);
    })(bi);
  }

  // Hearts and stars mixed — each with its own softer note at the same moment
  var W = canvas.width, H = canvas.height;
  var allShapeColors = heartColors.concat(starColors);
  var endShapes = [];
  for (var j = 0; j < 16; j++) {
    var shapeDelay = 500 + j * 230;
    if (celebAc) scheduleNote(celebAc, shapeNotes[j], 'triangle', 0.25, 0.6, celebAc.currentTime + shapeDelay / 1000);
    endShapes.push({
      x: W * (0.06 + Math.random() * 0.88),
      y: H * (0.06 + Math.random() * 0.6),
      color: allShapeColors[j % allShapeColors.length],
      scale: 0,
      targetScale: 55 + Math.random() * 55,
      alpha: 0,
      type: j % 3 === 2 ? 'stars' : 'hearts',
      delay: shapeDelay
    });
  }

  // Unified animation loop — firework particles + shapes share one canvas
  var startTime = Date.now();
  var endAnimId = null;

  function animateEnd() {
    endAnimId = requestAnimationFrame(animateEnd);
    var now = Date.now() - startTime;

    // Fade-trail background (keeps firework streaks)
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Firework particles
    for (var i = fwParticles.length - 1; i >= 0; i--) {
      var p = fwParticles[i];
      p.trail.push({ x: p.x, y: p.y, alpha: p.alpha });
      if (p.trail.length > 6) p.trail.shift();
      for (var t = 0; t < p.trail.length; t++) {
        var tr = p.trail[t];
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, p.radius * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = tr.alpha * 0.25 * (t / p.trail.length);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
      p.vx *= 0.97; p.vy *= 0.97; p.vy += p.gravity;
      p.x += p.vx; p.y += p.vy;
      p.alpha -= p.decay;
      if (p.alpha <= 0) fwParticles.splice(i, 1);
    }

    // Hearts and stars
    for (var j = 0; j < endShapes.length; j++) {
      var s = endShapes[j];
      var elapsed = now - s.delay;
      if (elapsed < 0) continue;
      if (elapsed < 400) {
        var prog = elapsed / 400;
        s.scale = s.targetScale * (1 + 0.25 * Math.sin(prog * Math.PI));
        s.alpha = Math.min(1, prog * 3);
      } else if (elapsed < 3200) {
        s.scale = s.targetScale;
        s.alpha = 1;
      } else {
        s.alpha = Math.max(0, 1 - (elapsed - 3200) / 800);
      }
      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.translate(s.x, s.y);
      if (s.type === 'hearts') { drawBigHeart(s.scale); } else { drawBigStar(s.scale); }
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  animateEnd();

  // Freeze the canvas at 6.5s — stop animating but leave everything visible
  setTimeout(function() {
    cancelAnimationFrame(endAnimId);
    fwParticles = [];
    // Show the restart button
    var restartBtn = document.getElementById('fw-restart');
    restartBtn.style.display = 'block';
    restartBtn.onclick = function() {
      restartBtn.style.display = 'none';
      overlay.classList.remove('active');
      practice.classList.remove('active');
      setup.style.display = '';
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }, 6500);
}

// ── MODE 0: Fireworks ──
var allPalettes = [
  ['#ff6b6b','#ffd93d','#ff9f43','#ff6b81'],
  ['#a29bfe','#fd79a8','#fdcb6e','#74b9ff'],
  ['#55efc4','#81ecec','#00cec9','#fdcb6e'],
  ['#ff7675','#e17055','#fdcb6e','#fab1a0'],
  ['#fd79a8','#e84393','#a29bfe','#ffffff'],
  ['#00b894','#00cec9','#55efc4','#81ecec'],
  ['#ffeaa7','#fdcb6e','#e17055','#d63031'],
  ['#74b9ff','#0984e3','#a29bfe','#ffffff'],
];
function randPalette() { return allPalettes[Math.floor(Math.random() * allPalettes.length)]; }
function randPos() {
  return { x: canvas.width * (0.15 + Math.random() * 0.7), y: canvas.height * (0.1 + Math.random() * 0.5) };
}

function runFireworks(count) {
  for (var i = 0; i < count; i++) {
    (function(idx) {
      var pos = randPos();
      setTimeout(function(){ burst(pos.x, pos.y, randPalette()); }, idx * 300);
    })(i);
  }
  animateParticles();
}

function burst(x, y, palette) {
  var count = 90;
  for (var i = 0; i < count; i++) {
    var angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.2;
    var speed = 3 + Math.random() * 5;
    fwParticles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1,
      radius: 3 + Math.random() * 3,
      color: palette[Math.floor(Math.random() * palette.length)],
      gravity: 0.08,
      decay: 0.013 + Math.random() * 0.007,
      trail: []
    });
  }
  ctx.save();
  ctx.globalAlpha = 0.9;
  var grad = ctx.createRadialGradient(x, y, 0, x, y, 60);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.3, palette[0]);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, 60, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function animateParticles() {
  fwAnimId = requestAnimationFrame(animateParticles);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = fwParticles.length - 1; i >= 0; i--) {
    var p = fwParticles[i];
    p.trail.push({ x: p.x, y: p.y, alpha: p.alpha });
    if (p.trail.length > 6) p.trail.shift();
    for (var t = 0; t < p.trail.length; t++) {
      var tr = p.trail[t];
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, p.radius * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = tr.alpha * 0.25 * (t / p.trail.length);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
    p.vx *= 0.97; p.vy *= 0.97; p.vy += p.gravity;
    p.x += p.vx; p.y += p.vy;
    p.alpha -= p.decay;
    if (p.alpha <= 0) fwParticles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

// ── MODE 1 & 2: Big Hearts / Stars ──
var bigShapes = [];   // { x, y, color, scale, alpha, targetScale }
var bigShapeAnimId = null;

var heartColors = ['#ff4d6d','#ff85a1','#ff6b9d','#c9184a','#ffb3c1','#ff0a54'];
var starColors  = ['#ffd700','#ffb703','#fb8500','#ff6b35','#ffe066','#ffca3a'];

function runBigShapes(type, count) {
  bigShapes = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  var colors = type === 'hearts' ? heartColors : starColors;
  var W = canvas.width, H = canvas.height;

  // Fully random positions across the screen
  for (var i = 0; i < count; i++) {
    bigShapes.push({
      x: W * (0.12 + Math.random() * 0.76),
      y: H * (0.12 + Math.random() * 0.55),
      color: colors[i % colors.length],
      scale: 0,
      targetScale: 80 + Math.random() * 40,
      alpha: 0,
      type: type,
      delay: i * 180  // stagger appearance
    });
  }

  var startTime = Date.now();

  function animateBigShapes() {
    bigShapeAnimId = requestAnimationFrame(animateBigShapes);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var now = Date.now() - startTime;

    for (var i = 0; i < bigShapes.length; i++) {
      var s = bigShapes[i];
      var elapsed = now - s.delay;
      if (elapsed < 0) continue;

      // Pop in over 400ms, hold, then fade out after 2800ms total
      if (elapsed < 400) {
        // overshoot spring-like pop
        var progress = elapsed / 400;
        s.scale = s.targetScale * (1 + 0.25 * Math.sin(progress * Math.PI));
        s.alpha = Math.min(1, progress * 3);
      } else if (elapsed < 2600) {
        s.scale = s.targetScale;
        s.alpha = 1;
      } else {
        var fadeProgress = (elapsed - 2600) / 600;
        s.alpha = Math.max(0, 1 - fadeProgress);
        s.scale = s.targetScale;
      }

      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = s.color;
      ctx.translate(s.x, s.y);

      if (s.type === 'hearts') {
        drawBigHeart(s.scale);
      } else {
        drawBigStar(s.scale);
      }
      ctx.fill();
      ctx.restore();
    }

    // Stop when all faded
    var allDone = bigShapes.every(function(s) {
      return (Date.now() - startTime - s.delay) > 3200;
    });
    if (allDone) {
      cancelAnimationFrame(bigShapeAnimId);
      bigShapeAnimId = null;
    }
  }
  animateBigShapes();
}

function drawBigHeart(r) {
  var s = r / 14;
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.bezierCurveTo(6, -14, 18, -4, 0, 12);
  ctx.bezierCurveTo(-18, -4, -6, -14, 0, -4);
  ctx.closePath();
}

function drawBigStar(r) {
  var spikes = 5;
  ctx.beginPath();
  for (var s = 0; s < spikes * 2; s++) {
    var ang = (s * Math.PI / spikes) - Math.PI / 2;
    var rad = s % 2 === 0 ? r : r * 0.42;
    if (s === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
    else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
  }
  ctx.closePath();
}

// ── Setup / Practice ──
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function parseWords(val) {
  return val.split(/[\s,]+/).map(function(w){ return w.trim(); }).filter(function(w){ return w.length > 0; });
}

var wordInput    = document.getElementById('word-input');
var startBtn     = document.getElementById('start-btn');
var practice     = document.getElementById('practice');
var setup        = document.getElementById('setup');
var wordDisplay  = document.getElementById('word-display');
var counter      = document.getElementById('word-counter');
var backBtn      = document.getElementById('back-btn');
var fwdBtn       = document.getElementById('fwd-btn');
var checkBtn     = document.getElementById('check-btn');
var exitBtn      = document.getElementById('exit-btn');
var fireworkBtn  = document.getElementById('firework-btn');
var sessionSlider = document.getElementById('session-slider');
var sessionNum   = document.getElementById('session-num');
var totalNum     = document.getElementById('total-num');
var modeMyBtn    = document.getElementById('mode-my');
var modeTopBtn   = document.getElementById('mode-top');
var poolSlider   = document.getElementById('pool-slider');
var poolNum      = document.getElementById('pool-num');
var poolRow      = document.getElementById('pool-row');

var DEFAULT_COUNT = 30;
var DEFAULT_POOL  = 200;
var topWords = [];
var currentMode = 'my';

// Load the top-words list
fetch('top1000.txt').then(function(r) { return r.text(); }).then(function(text) {
  topWords = text.split('\n').map(function(w) { return w.trim(); }).filter(function(w) { return w.length > 0; });
  poolSlider.max = topWords.length;
  if (currentMode === 'top') {
    var p = getUrlParams();
    var pool  = p.pool  !== null ? Math.min(p.pool,  topWords.length) : Math.min(DEFAULT_POOL,  topWords.length);
    var count = p.count !== null ? Math.min(p.count, pool)            : Math.min(DEFAULT_COUNT, pool);
    poolSlider.value   = pool;
    sessionSlider.max  = pool;
    sessionSlider.value = count;
    updateSliderUI();
  }
});

function getUrlParams() {
  var params = new URLSearchParams(window.location.search);
  var pool  = parseInt(params.get('pool'),  10);
  var count = parseInt(params.get('count'), 10);
  return {
    mode:  params.get('mode') === 'top' ? 'top' : 'my',
    pool:  isNaN(pool)  ? null : pool,
    count: isNaN(count) ? null : count
  };
}

function setUrlParams(mode, pool, count) {
  var params = new URLSearchParams(window.location.search);
  params.set('mode', mode);
  if (pool  !== undefined) params.set('pool',  pool);
  if (count !== undefined) params.set('count', count);
  history.replaceState(null, '', '?' + params.toString());
}

function updateSliderUI() {
  if (currentMode === 'top') {
    var pool  = parseInt(poolSlider.value, 10);
    var count = Math.min(parseInt(sessionSlider.value, 10), pool);
    poolSlider.max      = topWords.length || 999;
    sessionSlider.max   = pool;
    sessionSlider.value = count;
    poolNum.textContent    = pool;
    sessionNum.textContent = count;
    totalNum.textContent   = pool;
    document.getElementById('session-suffix').textContent = ' of those';
  } else {
    var total = parseWords(wordInput.value).length;
    var count = Math.min(parseInt(sessionSlider.value, 10), total || 1);
    sessionSlider.max   = total || 1;
    sessionSlider.value = count;
    totalNum.textContent   = total;
    sessionNum.textContent = count;
    document.getElementById('session-suffix').textContent = ' words';
  }
}

function switchMode(m) {
  currentMode = m;
  modeMyBtn.classList.toggle('active', m === 'my');
  modeTopBtn.classList.toggle('active', m === 'top');
  wordInput.style.display = m === 'my' ? '' : 'none';
  document.getElementById('my-words-hint').style.display = m === 'my' ? '' : 'none';
  poolRow.style.display   = m === 'top' ? 'block' : 'none';
  if (m === 'top') {
    var pool = parseInt(poolSlider.value, 10) || DEFAULT_POOL;
    sessionSlider.max = pool;
    if (parseInt(sessionSlider.value, 10) > pool) sessionSlider.value = pool;
  } else {
    var total = parseWords(wordInput.value).length;
    sessionSlider.max = total || 1;
    if (parseInt(sessionSlider.value, 10) > total) sessionSlider.value = total;
  }
  updateSliderUI();
  setUrlParams(m, parseInt(poolSlider.value, 10), parseInt(sessionSlider.value, 10));
}

// Initialise from URL
(function() {
  var p = getUrlParams();
  currentMode = p.mode;
  modeMyBtn.classList.toggle('active', currentMode === 'my');
  modeTopBtn.classList.toggle('active', currentMode === 'top');
  wordInput.style.display = currentMode === 'my' ? '' : 'none';
  document.getElementById('my-words-hint').style.display = currentMode === 'my' ? '' : 'none';
  poolRow.style.display   = currentMode === 'top' ? 'block' : 'none';

  if (currentMode === 'my') {
    var total   = parseWords(wordInput.value).length;
    var initial = p.count !== null ? Math.min(Math.max(1, p.count), total) : Math.min(DEFAULT_COUNT, total);
    sessionSlider.max   = total;
    sessionSlider.value = initial;
  } else {
    // top mode — topWords may not be loaded yet; use placeholders, fetch callback fixes up
    var pool    = p.pool  !== null ? p.pool  : DEFAULT_POOL;
    var initial = p.count !== null ? Math.min(p.count, pool) : Math.min(DEFAULT_COUNT, pool);
    poolSlider.value    = pool;
    sessionSlider.max   = pool;
    sessionSlider.value = initial;
    poolNum.textContent = pool;
  }
  updateSliderUI();
  setUrlParams(currentMode, parseInt(poolSlider.value, 10), parseInt(sessionSlider.value, 10));
})();

modeMyBtn.addEventListener('click', function() { switchMode('my'); });
modeTopBtn.addEventListener('click', function() { switchMode('top'); });

wordInput.addEventListener('input', function() {
  if (currentMode !== 'my') return;
  var total = parseWords(wordInput.value).length;
  if (parseInt(sessionSlider.value, 10) > total) sessionSlider.value = total;
  updateSliderUI();
  setUrlParams(currentMode, parseInt(poolSlider.value, 10), parseInt(sessionSlider.value, 10));
});

poolSlider.addEventListener('input', function() {
  var pool = parseInt(poolSlider.value, 10);
  if (parseInt(sessionSlider.value, 10) > pool) sessionSlider.value = pool;
  updateSliderUI();
  setUrlParams(currentMode, pool, parseInt(sessionSlider.value, 10));
});

sessionSlider.addEventListener('input', function() {
  updateSliderUI();
  setUrlParams(currentMode, parseInt(poolSlider.value, 10), parseInt(sessionSlider.value, 10));
});

startBtn.addEventListener('click', function() {
  var sessionCount = parseInt(sessionSlider.value, 10);
  var pool;
  if (currentMode === 'top') {
    if (topWords.length === 0) return;
    var poolCount = parseInt(poolSlider.value, 10);
    pool = shuffle(topWords.slice(0, poolCount)).slice(0, sessionCount);
  } else {
    var all = shuffle(parseWords(wordInput.value));
    if (all.length === 0) return;
    pool = all.slice(0, Math.min(sessionCount, all.length));
  }
  words = pool;
  idx = 0; colorIdx = 0;
  if (window.speechSynthesis) {
    var primer = new SpeechSynthesisUtterance('');
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }
  practice.classList.add('active');
  setup.style.display = 'none';
  showWord();
});

exitBtn.addEventListener('click', function() {
  practice.classList.remove('active');
  setup.style.display = '';
  if (window.speechSynthesis) window.speechSynthesis.cancel();
});

fwdBtn.addEventListener('click', function() {
  if (idx < words.length - 1) {
    idx++; colorIdx = (colorIdx+1) % BG_COLORS.length; showWord();
  } else {
    launchEndCelebration();
  }
});
backBtn.addEventListener('click', function() {
  if (idx > 0) { idx--; colorIdx = (colorIdx - 1 + BG_COLORS.length) % BG_COLORS.length; showWord(); }
});
checkBtn.addEventListener('click', function() {
  speakWord(words[idx]);
  showFlash('🔊  ' + words[idx]);
});
fireworkBtn.addEventListener('click', function() {
  launchFireworks(words[idx]);
});

var zoomedLetterIdx = -1;

function showWord() {
  wordDisplay.style.animation = 'none';
  wordDisplay.offsetHeight;
  wordDisplay.style.animation = '';
  zoomedLetterIdx = -1;
  renderLetters(words[idx]);
  counter.textContent = (idx+1) + ' / ' + words.length;
  practice.style.background = BG_COLORS[colorIdx];
  checkBtn.style.color = BG_COLORS[colorIdx];
  backBtn.disabled = idx === 0;
  fwdBtn.disabled  = false;
  fwdBtn.textContent = idx === words.length - 1 ? '\uD83C\uDF89' : '\u2192';
}

function renderLetters(word) {
  wordDisplay.innerHTML = '';
  word.split('').forEach(function(ch, i) {
    var span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch;
    span.addEventListener('click', function() {
      if (word.length === 1) {
        // Single letter — just zoom it
        if (span.classList.contains('zoomed')) {
          span.classList.remove('zoomed');
        } else {
          span.classList.add('zoomed');
        }
        return;
      }
      var isZoomed = zoomedLetterIdx === i;
      // Reset all
      wordDisplay.querySelectorAll('.letter').forEach(function(s) {
        s.classList.remove('zoomed', 'shrunk');
      });
      if (isZoomed) {
        // Toggle off
        zoomedLetterIdx = -1;
      } else {
        // Zoom this one, shrink others
        zoomedLetterIdx = i;
        span.classList.add('zoomed');
        wordDisplay.querySelectorAll('.letter').forEach(function(s, j) {
          if (j !== i) s.classList.add('shrunk');
        });
      }
    });
    wordDisplay.appendChild(span);
  });
}
