<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trick Words</title>
<!-- Comic Sans look-alike for devices without Comic Sans (iOS, Android) -->
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<form id="setup">
  <h1>Practice: Reading Words</h1>

  <fieldset class="field">
    <legend class="field-label">Fundations level</legend>
    <div class="segmented" id="level-picker"></div>
  </fieldset>

  <div class="field">
    <label class="field-label" for="unit-select">Current unit</label>
    <select id="unit-select" name="unit"></select>
  </div>

  <fieldset class="field">
    <legend class="field-label">Words from</legend>
    <div class="segmented">
      <label><input type="radio" name="scope" value="upto" checked><span>Everything up to this unit</span></label>
      <label><input type="radio" name="scope" value="only"><span>This unit only</span></label>
    </div>
  </fieldset>

  <fieldset class="field">
    <legend class="field-label">Word types</legend>
    <div class="chips">
      <label><input type="checkbox" name="types" value="trick" checked><span>❤️ Trick <em data-count="trick"></em></span></label>
      <label><input type="checkbox" name="types" value="decodable" checked><span>Decodable <em data-count="decodable"></em></span></label>
      <label><input type="checkbox" name="types" value="nonsense" checked><span>Nonsense <em data-count="nonsense"></em></span></label>
    </div>
  </fieldset>

  <div id="count-row">
    <label id="count-label" for="count-slider">Practise <strong id="count-num"></strong> of <span id="total-num"></span> words</label>
    <input type="range" id="count-slider" name="count" min="1">
  </div>
  <button type="submit" class="btn btn-glass" id="start-btn" disabled>Start ▶</button>
</form>

<div id="practice">
  <button class="btn btn-glass" id="reset-btn">✕ Reset words</button>
  <div id="word-display"></div>
  <div id="spoken-flash"></div>
  <div id="controls">
    <button class="btn" id="say-btn">🔊 Say it</button>
    <div id="controls-row">
      <button class="btn btn-glass btn-round" id="back-btn">←</button>
      <button class="btn btn-glass btn-round" id="celebrate-btn">🎆</button>
      <button class="btn btn-glass btn-round" id="fwd-btn">→</button>
    </div>
    <button class="btn btn-glass btn-round" id="repeat-btn" title="Practise this word again later">🐍</button>
  </div>
  <div id="word-counter"></div>
</div>

<div id="celebration">
  <canvas id="celebration-canvas"></canvas>
  <div id="celebration-word"></div>
  <button class="btn btn-glass" id="start-over-btn" hidden>← Start over</button>
</div>

<script src="fundations-word-lists.js"></script>
<script src="trick-word-hearts.js"></script>
<script src="sound.js"></script>
<script src="celebrations.js"></script>
<script src="app.js"></script>
</body>
</html>
